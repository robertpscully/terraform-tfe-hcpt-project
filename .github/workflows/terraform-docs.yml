name: Terraform Docs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: [ '**/*.tf', 'README.md' ]

permissions:
  contents: write

jobs:
  terraform-docs:
    name: Check terraform-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Run terraform-docs (inject into README.md)
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" quay.io/terraform-docs/terraform-docs:latest version || true
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" quay.io/terraform-docs/terraform-docs:latest markdown --output-file README.md --output-mode inject /workspace

      - name: Check for README changes
        id: check_changes
        run: |
          if git --no-pager diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(docs): update README.md with terraform-docs" || echo "No changes to commit"

      - name: Push README changes back to PR branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.head_ref }}
